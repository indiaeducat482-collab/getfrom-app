<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="workspace"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script>document.write(shell('ai-create.html'))</script><main class="main"><h1>✨ AI App Creator</h1><p class="muted">Describe your business. GetFROM generates an editable app structure from your description.</p><div class="panel"><textarea id="prompt" rows="7" placeholder="Example: Create a coaching center app with courses, admissions, student registration and contact form."></textarea><div style="height:10px"></div><input id="appname" class="field" placeholder="Optional app name"><div style="height:10px"></div><button class="btn" onclick="generate()">Generate Working App</button><div id="result"></div></div></main></div>
<script>async function generate(){let text=prompt.value.toLowerCase();if(!text.trim())return alert('Describe your app first');let t=TEMPLATES.find(x=>text.includes(x.category.toLowerCase())||x.name.toLowerCase().split(' ').some(w=>w.length>4&&text.includes(w)))||TEMPLATES[0];let app=makeApp(t,appname.value||undefined,prompt.value);let extra=[];if(/course|school|coach/.test(text))extra=['Courses','Admissions','Student Registration'];else if(/booking|appointment/.test(text))extra=['Services','Book Appointment'];else if(/shop|store|product/.test(text))extra=['Products','Orders'];else extra=['Services','About Us'];extra.forEach(n=>app.config.pages.push({id:uid(),name:n,components:[{id:uid(),type:'heading',value:n},{id:uid(),type:'text',value:'Edit this page in the App Builder.'}]}));try{await saveApp(app);result.innerHTML=`<div class="notice"><b>App generated!</b><br><a class="btn" href="app-builder.html?id=${app.id}">Open and Edit</a></div>`}catch(e){alert(e.message)}}</script></body></html>
