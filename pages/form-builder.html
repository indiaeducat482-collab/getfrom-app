<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="workspace"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script>document.write(shell('form-builder.html'))</script><main class="main"><h1>Working Form Builder</h1><p class="muted">Create fields and save the form configuration to Supabase.</p><div class="builder"><aside class="panel"><button class="tool" onclick="add('text')">＋ Text</button><button class="tool" onclick="add('email')">＋ Email</button><button class="tool" onclick="add('textarea')">＋ Long Text</button><button class="tool" onclick="add('date')">＋ Date</button></aside><section class="panel"><input id="title" class="field" value="New Form"><div id="fields"></div><button class="btn" onclick="saveForm()">Save Form</button></section><aside class="panel"><h3>Field Settings</h3><div id="props"></div></aside></div></main></div>
<script>let fields=[],sel=null;function add(type){fields.push({id:uid(),type,label:'New '+type+' field',required:false});sel=fields.length-1;render()}function render(){fieldsEl=window.fields;fieldsEl.innerHTML=fields.map((f,i)=>`<div class="comp ${i===sel?'sel':''}" onclick="sel=${i};render()"><b>${esc(f.label)}</b><br><small>${f.type}</small></div>`).join('');props.innerHTML=sel===null?'Select a field':`<input class="field" value="${esc(fields[sel].label)}" onchange="fields[sel].label=this.value;render()"><label><input type="checkbox" ${fields[sel].required?'checked':''} onchange="fields[sel].required=this.checked"> Required</label><button class="btn red" onclick="fields.splice(sel,1);sel=null;render()">Delete</button>`}async function saveForm(){let s=await requireLogin();let form={id:uid(),owner_id:s.user.id,title:title.value,config:{fields}};let{error}=await sb.from('gf_forms').insert(form);if(error)alert(error.message);else alert('Form saved. Use it in your apps or query it from Submissions.')}render()</script></body></html>
