<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="workspace"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script>document.write(shell('workspace.html'))</script>
<main class="main"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>My Workspace</h1><p class="muted">Your real apps are stored in Supabase.</p></div><a class="btn" href="templates.html">+ New App</a></div><div class="stats"><div class="stat"><b id="total">0</b><br>Apps</div><div class="stat"><b id="published">0</b><br>Published</div><div class="stat"><b>42+</b><br>Templates</div><div class="stat"><b>∞</b><br>Submissions</div></div><h2>My Apps</h2><div id="apps" class="grid"></div></main></div>
<script>(async()=>{await requireLogin();let apps=await getApps();total.textContent=apps.length;published.textContent=apps.filter(x=>x.published).length;apps.innerHTML=apps.length?apps.map(a=>`<div class="card"><div class="thumb">📱</div><div class="body"><span class="small">${esc(a.category||'Business')}</span><h3>${esc(a.name)}</h3><p class="muted">${esc(a.description||'')}</p><a class="btn" href="app-builder.html?id=${a.id}">Edit</a> ${a.published?`<a class="btn out" target="_blank" href="public-app.html?id=${a.id}">Open</a>`:''}</div></div>`).join(''):'<div class="empty">No apps yet. Create your first app from Templates or AI Create.</div>'})()</script></body></html>
