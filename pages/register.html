<link rel="stylesheet" href="../assets/style.css"><main class="public"><div class="panel"><h1>Create Account</h1><input id="e" class="field" placeholder="Email"><input id="p" class="field" type="password" placeholder="Password"><button class="btn" onclick="go()">Register</button><p id="m"></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/app.js"></script><script>async function go(){let{data,error}=await sb.auth.signUp({email:e.value,password:p.value});m.textContent=error?.message||'Account created';if(data?.session)location='myapps.html'}</script>
