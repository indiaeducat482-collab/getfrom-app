<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"></head><body>
<main class="auth"><div class="card body"><h1>Create account</h1><div class="formrow"><input id="name" class="field" placeholder="Full name"></div><div class="formrow"><input id="email" class="field" placeholder="Email"></div><div class="formrow"><input id="password" class="field" type="password" placeholder="Password (minimum 6 characters)"></div><button class="btn" onclick="go()">Register</button><p id="msg" class="muted"></p><a href="login.html">Already have an account?</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script>async function go(){let{data,error}=await sb.auth.signUp({email:email.value,password:password.value,options:{data:{full_name:name.value}}});msg.textContent=error?error.message:'Account created. Check your email if confirmation is enabled.';if(data?.session)setTimeout(()=>location='workspace.html',500)}</script></body></html>
