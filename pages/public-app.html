<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"></head><body><main class="public"><div id="app">Loading...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script>
<script>const id=new URLSearchParams(location.search).get('id');let appData,pg=0;
(async()=>{let{data,error}=await sb.from('gf_apps').select('*').eq('id',id).eq('published',true).maybeSingle();if(error||!data){app.innerHTML='<h2>App not found or not published.</h2>';return}appData=data;render()})();
function render(){let pages=appData.config?.pages||[];let p=pages[pg];app.innerHTML=`<header style="border-radius:15px;padding:22px;color:#fff;background:${appData.theme||'#6d4aff'}"><h1>${esc(appData.name)}</h1><p>${esc(appData.description||'')}</p></header><div class="filters">${pages.map((x,i)=>`<button class="filter ${i===pg?'on':''}" onclick="pg=${i};render()">${esc(x.name)}</button>`).join('')}</div><section>${(p.components||[]).map(c=>component(c)).join('')}</section>`}
function component(c){if(c.type==='heading')return `<h2>${esc(c.value)}</h2>`;if(c.type==='text')return `<p class="muted">${esc(c.value)}</p>`;if(c.type==='button')return `<button class="btn">${esc(c.value)}</button>`;if(c.type==='form')return `<div class="panel body"><h3>${esc(c.value)}</h3><form onsubmit="submitPublic(event)"><input class="field" name="name" placeholder="Name" required><div style="height:8px"></div><input class="field" name="email" type="email" placeholder="Email" required><div style="height:8px"></div><textarea class="field" name="message" placeholder="Message"></textarea><div style="height:8px"></div><button class="btn">Submit</button></form></div>`;return ''}
async function submitPublic(e){e.preventDefault();let fd=Object.fromEntries(new FormData(e.target));let owner=appData.owner_id;let{data:forms}=await sb.from('gf_forms').select('id').eq('owner_id',owner).limit(1);let formId=forms?.[0]?.id;if(!formId){alert('Owner has not created a form yet.');return}let{error}=await sb.from('gf_submissions').insert({form_id:formId,payload:fd});alert(error?error.message:'Thank you! Your submission was received.');if(!error)e.target.reset()}</script></body></html>
