<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="workspace"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script>document.write(shell('templates.html'))</script><main class="main"><h1>App Templates</h1><p class="muted">Choose a working starting point and edit every page.</p><div class="search"><input id="q" placeholder="Search templates..." oninput="draw()"></div><div id="filters" class="filters"></div><p id="count" class="muted"></p><div id="grid" class="grid"></div></main></div>
<script>let cat='All';filters.innerHTML=CATS.map(c=>`<button class="filter ${c==='All'?'on':''}" onclick="cat='${c}';[...filters.children].forEach(b=>b.classList.remove('on'));this.classList.add('on');draw()">${c}</button>`).join('');
function draw(){let s=q.value.toLowerCase(),a=TEMPLATES.filter(t=>(cat==='All'||t.category===cat)&&(`${t.name} ${t.category}`).toLowerCase().includes(s));count.textContent=`${a.length} templates`;grid.innerHTML=a.map(t=>`<div class="card"><div class="thumb">${t.icon}</div><div class="body"><b>${esc(t.name)}</b><p class="muted">${esc(t.description)}</p><button class="btn" onclick="use('${t.id}')">Use Template</button></div></div>`).join('')}
async function use(id){let s=await requireLogin();let t=TEMPLATES.find(x=>x.id===id),app=makeApp(t);try{await saveApp(app);location='app-builder.html?id='+app.id}catch(e){alert(e.message)}}draw()</script></body></html>
