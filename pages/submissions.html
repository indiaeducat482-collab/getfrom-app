<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="workspace"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script>document.write(shell('submissions.html'))</script><main class="main"><h1>Submissions</h1><p class="muted">Real public app submissions.</p><div id="out" class="panel">Loading...</div></main></div><script>(async()=>{await requireLogin();let{data,error}=await sb.from('gf_submissions').select('*,gf_forms(title,owner_id)').order('created_at',{ascending:false});if(error){out.textContent=error.message;return}let rows=(data||[]).filter(x=>x.gf_forms?.owner_id===(await session()).user.id);out.innerHTML=rows.length?`<table class="table"><tr><th>Form</th><th>Data</th><th>Date</th></tr>${rows.map(x=>`<tr><td>${esc(x.gf_forms?.title||'')}</td><td><pre>${esc(JSON.stringify(x.payload,null,2))}</pre></td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')}</table>`:'No submissions yet.'})()</script></body></html>
