<link rel="stylesheet" href="../assets/style.css"><div class="top"><b class="brand">GetFROM</b><button class="btn" onclick="create()">＋ Create App</button></div><div class="app"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/app.js"></script><script>document.write(nav())</script><main class="main"><h1>My Apps</h1><input id="s" class="field" placeholder="Search apps" oninput="load()"><div id="apps" class="grid"></div></main></div><script>async function create(){let n=prompt('App name','My New App');if(!n)return;await saveApp(newApp(n));load()}async function load(){await guard();let u=await user(),{data}=await sb.from('gf_apps').select('*').eq('owner_id',u.id);let x=(data||[]).filter(a=>a.name.toLowerCase().includes(s.value.toLowerCase()));apps.innerHTML=x.length?x.map(a=>`<div class="card"><div class="thumb">📱</div><h3>${esc(a.name)}</h3><p>${esc(a.category)}</p><button class="btn" onclick="location='builder.html?id=${a.id}'">Edit</button> <button class="btn out" onclick="publish('${a.id}')">Publish/Open</button><p><a href="#" onclick="duplicate('${a.id}')">Duplicate</a> · <a href="#" onclick="removeApp('${a.id}')">Delete</a></p></div>`).join(''):'<div class="panel">No apps yet. Create your first app.</div>'}async function publish(id){let a=(await sb.from('gf_apps').select('*').eq('id',id).single()).data;if(!a.published){await sb.from('gf_apps').update({published:true}).eq('id',id)}let link=location.href.replace('myapps.html','public.html?id='+id);prompt('Your public link:',link);load()}async function duplicate(id){let a=(await sb.from('gf_apps').select('*').eq('id',id).single()).data;a.id=crypto.randomUUID();a.name+=' Copy';a.published=false;await saveApp(a);load()}async function removeApp(id){if(confirm('Delete?')){await sb.from('gf_apps').delete().eq('id',id);load()}}load()</script>
