<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="workspace"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script>document.write(shell('app-builder.html'))</script><main class="main"><div style="display:flex;justify-content:space-between;gap:10px"><div><h1>Visual App Builder</h1><p class="muted">Select pages and components, edit text, save and publish.</p></div><div><button class="btn out" onclick="save()">Save</button> <button class="btn" onclick="publish()">Publish</button></div></div>
<div class="builder"><aside class="panel"><h3>Pages</h3><div id="pages"></div><button class="btn out" onclick="addPage()">+ Add Page</button><hr><h3>Components</h3><button class="tool" onclick="addComp('heading')">＋ Heading</button><button class="tool" onclick="addComp('text')">＋ Text</button><button class="tool" onclick="addComp('button')">＋ Button</button><button class="tool" onclick="addComp('form')">＋ Form</button></aside>
<section><div class="phone"><div class="screen"><div id="bar" class="appbar"></div><div id="screen"></div></div></div></section>
<aside class="panel"><h3>Properties</h3><div id="props"></div></aside></div></main></div>
<script>let app,pg=0,sel=null;const id=new URLSearchParams(location.search).get('id');
(async()=>{await requireLogin();let{data,error}=await sb.from('gf_apps').select('*').eq('id',id).maybeSingle();if(error||!data){alert('App not found');location='workspace.html';return}app=data;if(!app.config?.pages)app.config={pages:[]};render()})();
function render(){let pages=app.config.pages;pagesEl=window.pages;pagesEl.innerHTML=pages.map((p,i)=>`<button class="tool ${i===pg?'filter on':''}" onclick="pg=${i};sel=null;render()">${esc(p.name)}</button>`).join('');bar.textContent=app.name;bar.style.background=app.theme||'#6d4aff';screen.innerHTML=(pages[pg]?.components||[]).map((c,i)=>`<div class="comp ${sel===i?'sel':''}" onclick="sel=${i};render()"><small>${c.type.toUpperCase()}</small><div>${esc(c.value)}</div></div>`).join('')||'<div class="comp">Add components from the left.</div>';
props.innerHTML=`<label>App Name</label><input class="field" value="${esc(app.name)}" onchange="app.name=this.value;render()"><label>Brand Color</label><input class="field" type="color" value="${app.theme||'#6d4aff'}" onchange="app.theme=this.value;render()">`+(sel!==null?`<hr><label>Component Text</label><textarea class="field" onchange="app.config.pages[pg].components[sel].value=this.value;render()">${esc(pages[pg].components[sel].value)}</textarea><button class="btn red" onclick="delComp()">Delete Component</button>`:'<p class="muted">Click a component to edit it.</p>')}
function addPage(){let n=prompt('Page name','New Page');if(!n)return;app.config.pages.push({id:uid(),name:n,components:[]});pg=app.config.pages.length-1;sel=null;render()}
function addComp(type){let defaults={heading:'New Heading',text:'Write your content here.',button:'Click Here',form:'Contact Form'};app.config.pages[pg].components.push({id:uid(),type,value:defaults[type]});sel=app.config.pages[pg].components.length-1;render()}
function delComp(){app.config.pages[pg].components.splice(sel,1);sel=null;render()}
async function save(){try{await saveApp(app);alert('Saved to Supabase')}catch(e){alert(e.message)}}
async function publish(){app.published=true;await save();let url=publicUrl(app);navigator.clipboard?.writeText(url);alert('Published! Public URL copied when browser permission allows:\\n'+url)}</script></body></html>
