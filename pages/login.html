<link rel="stylesheet" href="../assets/style.css"><main class="public"><div class="panel"><h1>GetFROM Login</h1><input id="e" class="field" placeholder="Email"><input id="p" class="field" type="password" placeholder="Password"><button class="btn" onclick="go()">Login</button><p id="m"></p><a href="register.html">Register</a></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/app.js"></script><script>async function go(){let{error}=await sb.auth.signInWithPassword({email:e.value,password:p.value});m.textContent=error?.message||'Success';if(!error)location='myapps.html'}</script>
