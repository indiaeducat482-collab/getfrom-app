<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"></head><body>
<main class="auth"><div class="card body"><h1>Login</h1><div class="formrow"><input id="email" class="field" placeholder="Email"></div><div class="formrow"><input id="password" class="field" type="password" placeholder="Password"></div><button class="btn" onclick="go()">Login</button><p id="msg" class="muted"></p><a href="register.html">Create a new account</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script>async function go(){let{error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});msg.textContent=error?error.message:'Success';if(!error)location='workspace.html'}</script></body></html>
