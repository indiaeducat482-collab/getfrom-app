<link rel="stylesheet" href="../assets/style.css"><div class="top"><b class="brand">GetFROM Builder</b><span><button class="btn out" onclick="save()">Save</button> <button class="btn" onclick="pub()">Publish</button></span></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/app.js"></script><main class="main"><div class="builder"><div class="panel"><h3>Pages</h3><div id="pages"></div><button class="btn out" onclick="addPage()">+ Page</button><h3>Elements</h3><button class="tool" onclick="add('heading')">＋ Heading</button><button class="tool" onclick="add('text')">＋ Text</button><button class="tool" onclick="add('button')">＋ Button</button><button class="tool" onclick="add('form')">＋ Form</button></div><div class="preview"><div class="screen"><div id="bar" class="bar"></div><div id="screen"></div></div></div><div class="panel"><h3>Properties</h3><div id="props"></div></div></div></main><script>let id=new URLSearchParams(location.search).get('id'),A,P=0,S=null;(async()=>{await guard();A=(await sb.from('gf_apps').select('*').eq('id',id).single()).data;render()})();function render(){bar.textContent=A.name;bar.style.background=A.theme;pages.innerHTML=A.config.pages.map((p,i)=>`<button class="tool" onclick="P=${i};S=null;render()">${esc(p.name)}</button>`).join('');let b=A.config.pages[P].blocks;screen.innerHTML=b.map((x,i)=>`<div class="block" onclick="S=${i};render()"><small>${x.type}</small><div>${esc(x.text)}</div></div>`).join('');props.innerHTML=`<input class="field" value="${esc(A.name)}" onchange="A.name=this.value;render()"><input class="field" type="color" value="${A.theme}" onchange="A.theme=this.value;render()">`+(S!==null?`<textarea class="field" onchange="A.config.pages[P].blocks[S].text=this.value;render()">${esc(b[S].text)}</textarea>`:'Select an element')}function add(t){A.config.pages[P].blocks.push({type:t,text:t==='heading'?'New Heading':t==='form'?'Contact Form':'New Content'});S=A.config.pages[P].blocks.length-1;render()}function addPage(){let n=prompt('Page name');if(n){A.config.pages.push({name:n,blocks:[]});P=A.config.pages.length-1;render()}}async function save(){await saveApp(A);alert('Saved')}async function pub(){A.published=true;await saveApp(A);prompt('Public link:',location.href.replace('builder.html?id=','public.html?id='))}</script>
