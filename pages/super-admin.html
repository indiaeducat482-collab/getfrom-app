<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../assets/css/style.css"></head><body><div class="workspace"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/config.js"></script><script src="../assets/js/app.js"></script><script>document.write(shell('super-admin.html'))</script><main class="main"><h1>👑 Super Admin</h1><div id="admin" class="panel">Checking access...</div></main></div>
<script>(async()=>{let s=await requireLogin();let{data:p}=await sb.from('gf_profiles').select('*').eq('id',s.user.id).maybeSingle();if(!p||!['admin','super_admin'].includes(p.role)){admin.innerHTML='<h2>Access denied</h2><p class="muted">Your account must have admin or super_admin role in gf_profiles.</p>';return}let{data:profiles}=await sb.from('gf_profiles').select('*').order('created_at',{ascending:false});let{data:apps}=await sb.from('gf_apps').select('*');admin.innerHTML=`<div class="stats"><div class="stat"><b>${profiles?.length||0}</b><br>Users</div><div class="stat"><b>${apps?.length||0}</b><br>Apps</div><div class="stat"><b>${(apps||[]).filter(x=>x.published).length}</b><br>Published</div><div class="stat"><b>${esc(p.role)}</b><br>Your role</div></div><h2>Users</h2><table class="table"><tr><th>Name</th><th>Role</th><th>Created</th></tr>${(profiles||[]).map(x=>`<tr><td>${esc(x.full_name||'')}</td><td>${esc(x.role)}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')}</table>`})()</script></body></html>
