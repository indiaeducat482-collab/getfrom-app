<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Templates</title><link rel="stylesheet" href="assets/css/style.css"></head><body><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>document.write(header())</script><main class="wrap"><h1>App Templates</h1><p class="muted">Choose a template and customize it.</p><div class="search"><input id="q" placeholder="Search app templates..." oninput="render()"><button class="btn">Search</button></div><div id="filters" class="filters"></div><div id="cards" class="grid"></div></main><script>let cat='All',cats=['All',...new Set(templates.map(x=>x[2]))];filters.innerHTML=cats.map(c=>`<button class="filter" onclick="cat='${c}';render()">${c}</button>`).join('');function render(){let s=q.value.toLowerCase(),a=templates.filter(t=>(cat==='All'||t[2]===cat)&&t.join(' ').toLowerCase().includes(s));cards.innerHTML=a.map((t,i)=>`<div class="card"><div class="thumb">${t[0]}</div><div class="body"><span class="tag">${t[2]}</span><h3>${t[1]}</h3><p class="muted">${t[3]}</p><button class="btn out" onclick="preview(${i})">Preview</button> <button class="btn" onclick="useT(${i})">Use Template</button></div></div>`).join('')}function preview(i){let t=templates[i];document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="m"><div class="modalbox"><div class="row"><h2>${t[1]}</h2><button class="btn out" onclick="m.remove()">Close</button></div><div class="phone"><div class="screen"><div class="appbar" style="background:#8854d0">${t[1]}</div><div class="component">Welcome</div><div class="component">Services</div><div class="component">Contact Form</div></div></div></div></div>`)}function useT(i){let a=load(),x=createApp(templates[i]);a.push(x);save(a);location='app-builder.html?id='+x.id}render()</script></body></html>
