<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Templates</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/core.js"></script></head><body><script>(async()=>{if(!await auth())return;await shell('templates.html',`<div class="top"><h1>🎨 App Templates</h1><input id="q" placeholder="Search templates" oninput="draw()"></div><div id="list" class="templates"></div>`);draw()})();function draw(){let q=(document.querySelector('#q')?.value||'').toLowerCase();let a=T.filter(t=>(t[1]+t[2]+t[3]).toLowerCase().includes(q));list.innerHTML=a.map(t=>`<div class="card"><div class="preview">${t[0]}<h3>${E(t[1])}</h3></div><div class="body"><span class="badge">${E(t[2])}</span><p class="muted">${E(t[3])}</p><button class="btn" onclick="useT('${t[1]}')">Use Template</button></div></div>`).join('')}async function useT(n){let t=T.find(x=>x[1]===n),u=await user(),a=makeApp(t);a.owner_id=u.id;let{error}=await sb.from('apps').insert(a);if(error)return alert(error.message);location='app-builder.html?id='+a.id}</script></body></html>
