<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Public Form</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-client.js"></script></head><body><div class="public-form card" id="box">Loading form...</div><script>
(async()=>{let id=new URLSearchParams(location.search).get('id');let {data:f,error}=await sb.from('forms').select('*').eq('id',id).eq('published',true).single();let box=document.querySelector('#box');if(error){box.innerHTML='<h2>Form not found</h2>';return}box.innerHTML=`<h1>${f.title}</h1><p class="muted">${f.description||''}</p><form id="frm">${(f.fields||[]).map(x=>`<label><b>${x.label}</b>${x.type==='textarea'?`<textarea name="${x.id}"></textarea>`:`<input name="${x.id}" type="${x.type==='email'?'email':'text'}">`}</label>`).join('')}<button class="btn">Submit</button></form>`;document.querySelector('#frm').onsubmit=async e=>{e.preventDefault();let fd=new FormData(e.target),answers={};for(let [k,v] of fd.entries())answers[k]=v;let {error}=await sb.from('submissions').insert({form_id:f.id,answers});if(error)alert(error.message);else box.innerHTML='<div class="notice"><h2>Thank you!</h2>Your submission was received.</div>'}})()
</script></body></html>
