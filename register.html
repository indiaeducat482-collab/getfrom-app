<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register - GetFROM</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-client.js"></script></head><body><div class="auth-wrap"><div class="auth"><img src="assets/images/getfrom-logo.svg" style="width:220px"><h1>Create Account</h1><input id="name" placeholder="Full Name"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password (minimum 6 characters)"><button class="btn" style="width:100%" onclick="go()">Create GetFROM Account</button><p id="msg"></p><p><a href="login.html" style="color:#6c4cff">Already have an account?</a></p></div></div><script src="assets/js/auth.js"></script><script>async function go(){try{let r=await register(name.value,email.value,password.value);msg.textContent='Account created! Please check email if confirmation is enabled.';if(r.session)location.href='dashboard.html'}catch(e){msg.textContent=e.message}}</script></body></html>
