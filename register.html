<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/core.js"></script></head><body><div class="auth"><div class="authbox"><img src="assets/images/getfrom-logo.svg"><h2>Create Account</h2><input id="name" placeholder="Full Name"><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btn" style="width:100%" onclick="go()">Create Account</button><p id="msg" class="muted"></p><a href="login.html">Login</a></div></div><script>async function go(){let{data,error}=await sb.auth.signUp({email:email.value,password:pass.value,options:{data:{full_name:name.value}}});if(error)msg.textContent=error.message;else{msg.textContent='Account created. Login now.';if(data.session)location='dashboard.html'}}</script></body></html>
