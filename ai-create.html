<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Create</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/core.js"></script></head><body><script>(async()=>{if(!await auth())return;await shell('ai-create.html',`<div style="max-width:900px;margin:auto"><h1>✨ GetFROM AI Create</h1><p class="muted">Describe your business idea and generate an editable app starter.</p><div class="card"><textarea id="idea" placeholder="Example: Create a coaching management app for students, courses and admission"></textarea><input id="nm" placeholder="Optional App Name"><button class="btn" onclick="generate()">Generate App</button></div><div id="result"></div></div>`);})();async function generate(){let q=(idea.value+' '+nm.value).toLowerCase(),m={coaching:'Coaching Management',school:'School Portal',restaurant:'Restaurant Booking',hotel:'Hotel Booking',salon:'Salon Booking',clinic:'Clinic Appointment',doctor:'Clinic Appointment',crm:'Customer CRM',store:'Online Store',shop:'Online Store',employee:'Employee Portal',fitness:'Fitness Membership',job:'Job Application',support:'Support Portal'};let t=T[0];for(let k in m)if(q.includes(k)){t=T.find(x=>x[1]===m[k]);break}let u=await user(),a=makeApp(t,nm.value||t[1]);a.owner_id=u.id;let{error}=await sb.from('apps').insert(a);if(error)return alert(error.message);result.innerHTML=`<div class="card"><h2>✅ App Created: ${E(a.name)}</h2><a class="btn" href="app-builder.html?id=${a.id}">Open & Edit App</a></div>`}</script></body></html>
