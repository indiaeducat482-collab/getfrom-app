<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Create</title><link rel="stylesheet" href="assets/css/style.css"></head><body><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>document.write(header())</script><main class="wrap" style="max-width:850px"><h1>✨ GetFROM AI App Builder</h1><p class="muted">Describe your business app and generate an editable starter.</p><div class="panel"><textarea id="prompt" class="field" style="height:180px" placeholder="Create a coaching center app with student registration, courses and admission."></textarea><input id="name" class="field" placeholder="App name (optional)"><button class="btn" onclick="go()">Generate App</button><div id="result"></div></div></main><script>function go(){let s=(prompt.value+' '+name.value).toLowerCase(),t=templates[0];for(let x of templates)if(x.slice(1).join(' ').toLowerCase().split(/\W+/).some(w=>w.length>3&&s.includes(w))){t=x;break}let x=createApp(t,name.value||t[1]),a=load();a.push(x);save(a);result.innerHTML=`<div class="card body"><h2>✅ ${x.name} created</h2><a class="btn" href="app-builder.html?id=${x.id}">Open App Builder</a></div>`}</script></body></html>
