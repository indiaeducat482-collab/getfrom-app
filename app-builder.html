<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Builder</title><link rel="stylesheet" href="assets/css/style.css"></head><body><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>document.write(header())</script><main class="wrap"><div class="row"><h1>GetFROM App Builder</h1><div><button class="btn out" onclick="store()">Save</button> <button class="btn" onclick="pub()">Publish</button></div></div><div class="builder"><aside class="panel"><h3>Pages</h3><div id="pages"></div><button class="btn out" onclick="addPage()">+ Add Page</button><hr><h3>Add Element</h3><button class="btn out field" onclick="add('heading')">+ Heading</button><button class="btn out field" onclick="add('text')">+ Text</button><button class="btn out field" onclick="add('button')">+ Button</button><button class="btn out field" onclick="add('form')">+ Form</button></aside><section><div class="phone"><div class="screen"><div id="bar" class="appbar"></div><div id="screen"></div></div></div></section><aside class="panel"><h3>Properties</h3><div id="props"></div></aside></div></main><script>let id=new URLSearchParams(location.search).get('id'),apps=load(),app=apps.find(x=>x.id===id)||createApp(templates[0]),page=0,sel=null;function render(){pages.innerHTML=app.pages.map((x,i)=>`<button class="field btn ${i===page?'':'out'}" onclick="page=${i};sel=null;render()">${esc(x.name)}</button>`).join('');bar.textContent=app.name;bar.style.background=app.theme.primary;let pg=app.pages[page];screen.innerHTML=pg.components.map((c,i)=>`<div class="component ${sel===i?'sel':''}" onclick="sel=${i};render()"><b>${c.type.toUpperCase()}</b><div>${esc(c.text)}</div></div>`).join('');props.innerHTML=`<input class="field" value="${esc(app.name)}" onchange="app.name=this.value;render()"><input class="field" type="color" value="${app.theme.primary}" onchange="app.theme.primary=this.value;render()">`+(sel!==null?`<textarea class="field" onchange="app.pages[page].components[sel].text=this.value;render()">${esc(pg.components[sel].text)}</textarea><button class="btn out" onclick="del()">Delete Element</button>`:'<p class="muted">Select an element.</p>')}function add(type){app.pages[page].components.push({type,text:{heading:'New Heading',text:'Your text here',button:'Click Here',form:'New Form'}[type]});sel=app.pages[page].components.length-1;render()}function addPage(){app.pages.push({name:'New Page',components:[]});page=app.pages.length-1;render()}function del(){app.pages[page].components.splice(sel,1);sel=null;render()}function store(){let i=apps.findIndex(x=>x.id===app.id);if(i<0)apps.push(app);else apps[i]=app;save(apps);alert('Saved successfully')}function pub(){app.published=true;store();alert('Published successfully')}render()</script></body></html>
