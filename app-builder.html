<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>App Builder</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/core.js"></script></head><body><script>let A,pi=0,ci=null;async function init(){if(!await auth())return;let id=new URLSearchParams(location.search).get('id');if(id){let{data,error}=await sb.from('apps').select('*').eq('id',id).single();if(error)return alert(error.message);A=data}else A=makeApp(T[0],'My New App');await shell('apps.html','<div id="root"></div>');render()}function render(){let p=A.pages[pi],c=p.components[ci];root.innerHTML=`<div class="top"><h1>📱 App Builder</h1><div><button class="btn out" onclick="save()">Save</button> <button class="btn" onclick="publish()">Publish</button></div></div><div class="builder"><div class="card"><h3>Pages</h3>${A.pages.map((x,i)=>`<button class="btn ${i===pi?'':'out'}" style="width:100%;margin:4px 0" onclick="pi=${i};ci=null;render()">${E(x.name)}</button>`).join('')}<button class="btn out" onclick="addPage()">+ Add Page</button><hr><h3>Elements</h3>${['heading','text','button','image','divider'].map(x=>`<button class="btn out fieldbtn" onclick="addC('${x}')">+ ${x}</button>`).join('')}</div><div class="phone"><div class="screen" style="background:${A.theme.background}"><div class="apphead" style="background:${A.theme.primary}"><b>${E(A.name)}</b></div><div class="nav">${A.pages.map(x=>`<span>${E(x.name)}</span>`).join(' · ')}</div><div style="padding:16px">${p.components.map((x,i)=>`<div class="comp ${ci===i?'sel':''}" onclick="ci=${i};render()"><b>${x.type}</b><br>${E(x.text||'')}</div>`).join('')}</div></div></div><div class="card"><h3>App Settings</h3><input value="${E(A.name)}" onchange="A.name=this.value"><label>Primary Color</label><input type="color" value="${A.theme.primary}" onchange="A.theme.primary=this.value;render()">${c?`<hr><h3>Edit Element</h3><textarea onchange="A.pages[pi].components[ci].text=this.value;render()">${E(c.text||'')}</textarea><button class="btn danger" onclick="pdel()">Delete Element</button>`:'<p class="muted">Select an element.</p>'}</div></div>`}function addPage(){A.pages.push({id:crypto.randomUUID(),name:'New Page',components:[]});pi=A.pages.length-1;ci=null;render()}function addC(type){let txt={heading:'New Heading',text:'Your text goes here',button:'Click Me',image:'Image URL',divider:'────────'}[type];A.pages[pi].components.push({id:crypto.randomUUID(),type,text:txt});ci=A.pages[pi].components.length-1;render()}function pdel(){A.pages[pi].components.splice(ci,1);ci=null;render()}async function save(){let u=await user();A.owner_id=u.id;A.updated_at=new Date().toISOString();let{error}=await sb.from('apps').upsert(A);if(error)alert(error.message);else alert('Saved successfully')}async function publish(){A.published=true;await save();alert('Published successfully')}init()</script></body></html>
