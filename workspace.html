<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace</title><link rel="stylesheet" href="assets/css/style.css"></head><body><script src="assets/js/data.js"></script><script src="assets/js/app.js"></script><script>document.write(header())</script><div class="workspace"><aside class="side"><a class="on" href="workspace.html">🏠 Workspace</a><a href="ai-create.html">✨ AI Create</a><a href="templates.html">🎨 Templates</a><a href="form-builder.html">📝 Forms</a><a href="super-admin.html">👑 Super Admin</a></aside><main class="content"><div class="row"><h1>My Workspace</h1><a class="btn" href="ai-create.html">+ Create App</a></div><div id="apps" class="grid"></div></main></div><script>let a=load();apps.innerHTML=a.length?a.map(x=>`<div class="card"><div class="thumb">📱</div><div class="body"><span class="tag">${x.category}</span><h3>${esc(x.name)}</h3><p class="muted">${esc(x.description)}</p><a class="btn" href="app-builder.html?id=${x.id}">Edit App</a></div></div>`).join(''):'<div class="panel">No apps yet. Create one with AI or templates.</div>'</script></body></html>
