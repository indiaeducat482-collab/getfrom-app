<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forms</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/core.js"></script></head><body><script>(async()=>{let u=await auth();if(!u)return;let{data:f}=await sb.from('forms').select('*').eq('owner_id',u.id);f=f||[];await shell('forms.html',`<div class="top"><h1>📄 My Forms</h1><a class="btn" href="form-builder.html">+ Create Form</a></div><div class="card">${f.length?f.map(x=>`<p><b>${E(x.title)}</b> — ${x.published?'Published':'Draft'}</p>`).join(''):'No forms yet.'}</div>`);})()</script></body></html>
