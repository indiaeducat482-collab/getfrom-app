<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Forms</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-client.js"></script></head><body><script src="assets/js/auth.js"></script><script src="assets/js/layout.js"></script><script src="assets/js/forms.js"></script><script>
(async()=>{await requireAuth();let fs=await myForms();layout('forms.html',`<div class="toolbar"><h1>My Forms</h1><a class="btn" href="form-builder.html">+ Create Form</a></div><div class="card">${fs.length?fs.map(f=>`<div class="list-item"><div><b>${esc(f.title)}</b><br><span class="muted">${f.published?'Published':'Draft'}</span></div><div><a class="btn outline" href="form-builder.html?id=${f.id}">Edit</a> ${f.published?`<a class="btn" target="_blank" href="public-form.html?id=${f.id}">Open</a>`:''}</div></div>`).join(''):'<div class="empty">No forms yet.</div>'}</div>`);})()
</script></body></html>
