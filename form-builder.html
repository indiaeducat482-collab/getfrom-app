<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Builder</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/core.js"></script></head><body><script>let F=[];async function init(){let u=await auth();if(!u)return;await shell('form-builder.html',`<div class="top"><h1>🛠️ Form Builder</h1><button class="btn" onclick="save()">Save & Publish</button></div><div class="builder"><div class="card">${['text','email','number','date','textarea'].map(x=>`<button class="btn out fieldbtn" onclick="add('${x}')">+ ${x}</button>`).join('')}</div><div class="card"><input id="title" placeholder="Form Title"><div id="fields"></div></div><div class="card"><h3>Public Form</h3><p class="muted">Saved forms can receive public submissions.</p></div></div>`);draw()}function add(t){F.push({id:crypto.randomUUID(),type:t,label:t.toUpperCase()});draw()}function draw(){fields.innerHTML=F.map((x,i)=>`<div class="card"><input value="${E(x.label)}" onchange="F[${i}].label=this.value"><small>${x.type}</small></div>`).join('')}async function save(){let u=await user(),o={owner_id:u.id,title:title.value||'Untitled Form',fields:F,published:true};let{error}=await sb.from('forms').insert(o);if(error)return alert(error.message);location='forms.html'}init()</script></body></html>
