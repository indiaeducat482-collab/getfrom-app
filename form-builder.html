<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form Builder</title><link rel="stylesheet" href="assets/css/style.css"></head><body><script src="assets/js/app.js"></script><script>document.write(header())</script><main class="wrap"><h1>GetFROM Form Builder</h1><div class="builder"><aside class="panel"><h3>Elements</h3><button class="btn out field" onclick="add('Short Text')">Short Text</button><button class="btn out field" onclick="add('Email')">Email</button><button class="btn out field" onclick="add('Phone')">Phone</button><button class="btn out field" onclick="add('Date')">Date</button><button class="btn out field" onclick="add('Dropdown')">Dropdown</button><button class="btn out field" onclick="add('File Upload')">File Upload</button></aside><section class="panel"><input class="field" placeholder="Form Title"><div id="fields"></div><button class="btn">Save Form</button></section><aside class="panel"><h3>Settings</h3><p class="muted">Select and configure fields.</p></aside></div></main><script>let f=[];function add(x){f.push(x);fields.innerHTML=f.map(x=>`<div class="component"><b>${x}</b><input class="field" placeholder="${x} label"></div>`).join('')}</script></body></html>
