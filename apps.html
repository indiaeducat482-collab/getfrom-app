<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Apps</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/core.js"></script></head><body><script>(async()=>{let u=await auth();if(!u)return;let{data:a,error}=await sb.from('apps').select('*').eq('owner_id',u.id).order('updated_at',{ascending:false});if(error)a=[];await shell('apps.html',`<div class="top"><h1>📱 My Apps</h1><div><a class="btn out" href="templates.html">Templates</a> <a class="btn" href="app-builder.html">+ New App</a></div></div><div class="templates">${a.length?a.map(x=>`<div class="card"><span class="badge">${x.published?'Published':'Draft'}</span><h3>${E(x.name)}</h3><p class="muted">${E(x.description||'')}</p><a class="btn" href="app-builder.html?id=${x.id}">Edit</a> <button class="btn danger" onclick="del('${x.id}')">Delete</button></div>`).join(''):'<div class="card">No apps yet.</div>'}</div>`);window.del=async id=>{if(confirm('Delete app?')){await sb.from('apps').delete().eq('id',id);location.reload()}}})()</script></body></html>
