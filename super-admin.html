<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Super Admin</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/core.js"></script></head><body><script>(async()=>{let p=await profile();if(!p||p.role!=='super_admin'){alert('Super Admin access required');location='dashboard.html';return}let{data:users}=await sb.from('profiles').select('*'),{data:apps}=await sb.from('apps').select('*'),{data:forms}=await sb.from('forms').select('*');await shell('super-admin.html',`<h1>👑 Super Admin</h1><div class="grid"><div class="card"><h2>${users?.length||0}</h2>Users</div><div class="card"><h2>${apps?.length||0}</h2>Apps</div><div class="card"><h2>${forms?.length||0}</h2>Forms</div></div><div class="card"><h2>User Management</h2><table class="table"><tr><th>Name</th><th>Role</th><th>Action</th></tr>${(users||[]).map(u=>`<tr><td>${E(u.full_name||'-')}</td><td>${E(u.role)}</td><td><button class="btn" onclick="role('${u.id}','super_admin')">Make Super Admin</button> <button class="btn out" onclick="role('${u.id}','user')">Make User</button></td></tr>`).join('')}</table></div>`);window.role=async(id,r)=>{let x=await sb.from('profiles').update({role:r}).eq('id',id);if(x.error)alert(x.error.message);else location.reload()}})()</script></body></html>
