<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/core.js"></script></head><body><script>(async()=>{let u=await auth();if(!u)return;let[{data:a},{data:f}]=await Promise.all([sb.from('apps').select('*').eq('owner_id',u.id),sb.from('forms').select('*').eq('owner_id',u.id)]);await shell('dashboard.html',`<h1>Welcome to GetFROM 👋</h1><p class="muted">${E(u.email)}</p><div class="grid"><div class="card"><h2>${a?.length||0}</h2>Apps</div><div class="card"><h2>${f?.length||0}</h2>Forms</div><div class="card"><h2>${a?.filter(x=>x.published).length||0}</h2>Published</div></div><div class="grid"><div class="card"><h3>✨ AI Create</h3><a class="btn" href="ai-create.html">Open</a></div><div class="card"><h3>📱 App Builder</h3><a class="btn" href="app-builder.html">Create App</a></div><div class="card"><h3>🎨 Templates</h3><a class="btn" href="templates.html">Browse</a></div></div>`);})()</script></body></html>
