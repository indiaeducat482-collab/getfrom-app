<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - GetFROM</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/supabase-client.js"></script></head><body><div class="auth-wrap"><div class="auth"><img src="assets/images/getfrom-logo.svg" style="width:220px"><h1>Welcome back</h1><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button class="btn" style="width:100%" onclick="go()">Login</button><p id="msg"></p><p>New user? <a href="register.html" style="color:#6c4cff">Create Account</a></p></div></div><script src="assets/js/auth.js"></script><script>async function go(){try{await login(email.value,password.value);location.href='dashboard.html'}catch(e){msg.textContent=e.message}}</script></body></html>
