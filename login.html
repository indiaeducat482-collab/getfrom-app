<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><link rel="stylesheet" href="assets/css/style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/core.js"></script></head><body><div class="auth"><div class="authbox"><img src="assets/images/getfrom-logo.svg"><h2>Login</h2><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btn" style="width:100%" onclick="go()">Login</button><p id="msg" class="muted"></p><a href="register.html">Create account</a></div></div><script>async function go(){let{error}=await sb.auth.signInWithPassword({email:email.value,password:pass.value});if(error)msg.textContent=error.message;else location='dashboard.html'}</script></body></html>
